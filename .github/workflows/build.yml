name: Build Scriba Capture

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/ScribaSweep_artefacts/Release/VST3", "build/ScribaSweep_artefacts/Release/Standalone" -DestinationPath "ScribaCapture-Windows.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/ScribaSweep_artefacts/Release
          zip -r -y "$GITHUB_WORKSPACE/ScribaCapture-macOS.zip" VST3 AU Standalone

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ScribaCapture-${{ matrix.name }}
          path: ScribaCapture-*.zip
